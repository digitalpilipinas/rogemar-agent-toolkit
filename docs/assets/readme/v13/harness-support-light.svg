<text x="50" y="58" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Same skills, packaged per assistant</text>
<text x="50" y="88" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Every route carries the seven core skills, including project-readiness. Each assistant gets its own Forge entry.</text>
<rect x="50" y="118" width="360" height="222" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/>
<rect x="64" y="118" width="38" height="3" rx="1.5" fill="#0891B2"/>
