<text x="890" y="208" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">Entry: cursor-forge, cursor-forge-setup</text>
<text x="890" y="238" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Lists only Cursor-compatible skills</text>
<text x="890" y="268" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Add the repository URL as marketplace</text>
