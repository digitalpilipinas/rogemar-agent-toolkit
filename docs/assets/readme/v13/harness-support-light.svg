<text x="640" y="640" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Claude, Factory and Gemini plugins carry the whole folder; the managed installer filters.</text>
<text x="640" y="664" font-size="15" font-weight="600" fill="#0E7490" text-anchor="middle">Install, discovery and a completed workflow are separate checks; verify each in a fresh session.</text>
