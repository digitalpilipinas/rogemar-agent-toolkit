<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Core and optional packs</title>
<desc id="d">A fresh install is the seven-skill core: workflow-orchestrator, create-plan, first-time-right-delivery, bug-triage, code-review-and-quality, code-review-tests and project-readiness. Optional packs add engineering, design, web, mobile, data and security, content, release and research work.</desc>
