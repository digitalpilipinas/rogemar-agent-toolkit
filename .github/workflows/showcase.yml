name: Publish toolkit showcase

on:
  pull_request:
    paths: ['docs/showcase/**', 'docs/assets/readme/**', 'README.md', 'scripts/build_showcase*', 'scripts/check_showcase.cjs', 'tests/test_showcase.py', '.github/workflows/showcase.yml']
  push:
    branches: [main]
    paths: ['docs/showcase/**', 'docs/assets/readme/**', 'README.md', 'scripts/build_showcase*', 'scripts/check_showcase.cjs', 'tests/test_showcase.py', '.github/workflows/showcase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p test_showcase.py -v
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: docs/showcase
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
