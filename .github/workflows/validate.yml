name: Validate toolkit

# Hosted CI confirms; the local gate decides (docs/quality/ci-strategy.md).
# Every check runs through scripts/ci.py, the same command local agents run.
# No paths filter: release archives package docs/ and CHANGELOG.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu only, for fast feedback. Main pushes, tags, nightly and manual runs add macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-latest"]') }}
        python: ["3.9", "3.11"]  # 26.04 (ubuntu-latest) has no setup-python 3.9 build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; exact tag resolution recorded in docs/alignment/action-pins.json
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; exact tag resolution recorded in docs/alignment/action-pins.json
        with:
          python-version: ${{ matrix.python }}
      - name: Select change-relevant owner suites
        id: owner_checks
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          validation_base="$(python3 -B scripts/ci.py --print-base)"
          python3 -B scripts/select_checks.py --base "$validation_base" > "$RUNNER_TEMP/owner-checks.json"
          python3 -c 'import json, os; data = json.load(open(os.environ["RUNNER_TEMP"] + "/owner-checks.json")); selected = any(x["check"] == "forge-native" for x in data["checks"]); print("needs_bun=" + str(selected).lower())' >> "$GITHUB_OUTPUT"
      - name: Set up Bun for selected native Forge checks
        if: steps.owner_checks.outputs.needs_bun == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install selected native Forge dependencies
        if: steps.owner_checks.outputs.needs_bun == 'true'
        working-directory: plugins/rogemar-agent-toolkit/skills/codex-forge/scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up Node for owner suites
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; observed in action-pins.json
        with:
          node-version: 26.12.0
      - name: Run the CI entrypoint
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/ci.py --receipt "$RUNNER_TEMP/ci-receipt.json" --dist dist
