              "activation": "explicit-only",
              "skill_sha256": "458b269eab8e95a1573276955312f7d2a13ae8599879a9efc748248f6bc34b56",
              "required_resources": []
            },
            "principle-encode-lessons-in-structure": {
              "source": "pstack/skills/principle-encode-lessons-in-structure",
              "description": "Apply when you catch yourself writing the same instruction a second time, or notice a recurring correction. Encode the rule as a lint, metadata flag, runtime check, or script instead of more text.",
              "activation": "explicit-only",
              "skill_sha256": "77044c83a9ac6df78fc643887ea5f1f11f082adaf14b717c060cdaed03cce863",
              "required_resources": []
            },
            "principle-exhaust-the-design-space": {
              "source": "pstack/skills/principle-exhaust-the-design-space",
