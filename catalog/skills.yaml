              "skill_sha256": "62ac2862c2caa22dd14531f51c9c6bb445ceb198ca98a687e25b4d47c1f10a28",
              "required_resources": []
            },
            "principle-build-the-lever": {
              "source": "pstack/skills/principle-build-the-lever",
